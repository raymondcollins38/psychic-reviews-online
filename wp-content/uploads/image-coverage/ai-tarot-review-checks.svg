<svg xmlns="http://www.w3.org/2000/svg" width="640" height="690" viewBox="0 0 640 690" role="img" aria-labelledby="title description">
  <title id="title">Five checks for an AI tarot review</title>
  <desc id="description">Follow the cards, check the question, recognise limits, understand the cost, and protect privacy. These are review criteria, not evidence of prediction.</desc>
